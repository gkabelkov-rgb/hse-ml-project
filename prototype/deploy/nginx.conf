# Конфиг сайта с прототипами.
# Положить на сервере в /etc/nginx/sites-available/wb-proto
# и включить: ln -s /etc/nginx/sites-available/wb-proto /etc/nginx/sites-enabled/
#
# ЗАМЕНИТЕ proto.example.com на ваш домен (или поддомен).

server {
    listen 80;
    listen [::]:80;
    server_name proto.example.com;

    root /var/www/wb-proto;
    index index.html;

    # аккуратные адреса: /v1/ и /v2/
    location / {
        try_files $uri $uri/ =404;
    }

    # кадры Figma кэшируем надолго, разметку — коротко
    location ~* \.(png|jpe?g|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.(html|js)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # закрыть прототип паролем (по желанию) — см. README, шаг 6
    # auth_basic "Прототип WB × ОФМ";
    # auth_basic_user_file /etc/nginx/.htpasswd-wb;

    client_max_body_size 32m;
}
