<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB × ОФМ — оформление автокредита (ОТП / ВТБ)</title>
<style>
/* ============ базовое ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  background: #23252b; display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; color: #1b1b21;
}
.topbar { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 18px; color: #b9bcc7; font-size: 13px; }
.topbar b { color: #fff; font-weight: 600; }
.topbar button { margin-left: auto; background: none; border: 1px solid #4a4d57; color: #b9bcc7; border-radius: 999px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
.topbar button:hover { color: #fff; border-color: #777; }

/* ============ телефон ============ */
.phone-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 0 20px; }
.phone {
  width: 393px; height: 852px; max-height: calc(100vh - 70px);
  background: #fff; border-radius: 46px; border: 10px solid #17181c;
  overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; scrollbar-width: none; position: relative; }
.screen::-webkit-scrollbar { display: none; }

/* статус-бар iOS */
.sb { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 6px; font-size: 15px; font-weight: 600; }
.sb .icons { letter-spacing: 2px; font-size: 13px; }
.sb.light { color: #fff; }
/* пилюля возврата в WB (как в iOS при переходе в стороннее приложение) */
.backpill {
  position: absolute; top: 10px; left: 10px; z-index: 60;
  background: #cb11ab; color: #fff; font-size: 12px; font-weight: 600;
  padding: 6px 12px 6px 8px; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 10px rgba(203,17,171,.45);
  animation: pillin .25s ease;
}
@keyframes pillin { from { transform: translateY(-16px); opacity: 0; } }
.backpill:hover { filter: brightness(1.08); }
.home-ind { flex: 0 0 auto; padding: 6px 0 8px; display: flex; justify-content: center; }
.home-ind i { display: block; width: 134px; height: 5px; border-radius: 3px; background: #111; }
.home-ind.on-dark i { background: #fff; }

/* ============ общие атомы ============ */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer;
  font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 14px; padding: 15px 18px; width: 100%; transition: filter .15s, opacity .15s; }
.btn:active { filter: brightness(.93); }
.btn-wb { background: #a232e8; color: #fff; }
.btn-orange { background: #ff8c39; color: #fff; border-radius: 999px; }
.btn-dark { background: #33343c; color: #fff; border-radius: 999px; }
.btn-site { background: #9a27f5; color: #fff; border-radius: 999px; }
.btn-site:disabled { background: #d9dce3; color: #9aa0ad; cursor: default; }
.btn-lite { background: #f5f0fb; color: #9a27f5; }
.btn-ghost { background: #fff; color: #9a27f5; border: 1.5px solid #d9b8fb; border-radius: 999px; }
.btn-white { background: #fff; color: #1b1b21; border: 1px solid #e7e8ee; }
.chipbtn { display: inline-flex; align-items: center; border: 1.5px solid #c98ef7; color: #9a27f5; background: #fff;
  border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.link { color: #a232e8; cursor: pointer; text-decoration: none; }
.dim { color: #8d93a1; }
.small { font-size: 12px; }

/* демо-элементы (не из дизайна) */
.demo { display: inline-flex; align-items: center; gap: 6px; margin: 10px auto 0; padding: 6px 12px; border: 1.5px dashed #9aa0ad;
  color: #6d7380; background: rgba(255,255,255,.75); border-radius: 999px; font-size: 11.5px; cursor: pointer; }
.demo:hover { border-color: #9a27f5; color: #9a27f5; }
.demo-row { display: flex; flex-direction: column; align-items: center; padding: 4px 0 10px; }

/* ============ WB app ============ */
.wb-head { background: linear-gradient(180deg, #8e15c9, #a11ee2); color: #fff; padding-bottom: 12px; }
.wb-head .sb { color: #fff; }
.wb-nav { display: flex; align-items: center; padding: 8px 16px 4px; gap: 12px; }
.wb-nav .ttl { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
.wb-nav .ico { width: 24px; font-size: 20px; cursor: pointer; text-align: center; }
.wb-search-field { margin: 8px 14px 0; background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 8px; color: #1b1b21; }
.wb-search-field input { border: none; outline: none; flex: 1; font-size: 15px; font-family: inherit; }
.wb-search-field .x { color: #b6bac4; }

.wb-nav2 { display: flex; align-items: center; padding: 12px 16px 6px; gap: 14px; }
.wb-nav2 .sp { flex: 1; }
.wb-nav2 .ico { font-size: 21px; cursor: pointer; color: #1b1b21; }

.chips { display: flex; gap: 8px; padding: 12px 14px 2px; flex-wrap: wrap; }
.chip { background: #f1f1f5; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; white-space: nowrap; }

.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
.pcard { position: relative; }
.pcard .ph { position: relative; border-radius: 14px; overflow: hidden; }
.pcard .fav { position: absolute; top: 8px; right: 8px; font-size: 18px; color: #33343c; }
.badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; position: absolute; bottom: 8px; left: 8px; }
.bdg-sale { background: #ffe3ee; color: #e5397c; font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 6px; }
.bdg-credit { background: #f0e4ff; color: #a232e8; font-size: 10.5px; font-weight: 700; padding: 3px 6px; border-radius: 6px; letter-spacing: .3px; }
.price { font-size: 18px; font-weight: 700; margin-top: 8px; }
.stockline { color: #e0334c; font-size: 12px; font-weight: 600; margin-top: 3px; }
.stockbar { height: 3px; border-radius: 2px; background: #eceef2; margin-top: 4px; position: relative; overflow: hidden; }
.stockbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 18%; background: #e0334c; border-radius: 2px; }
.seller { display: flex; align-items: center; gap: 5px; font-size: 13px; margin-top: 6px; }
.vcheck { width: 15px; height: 15px; border-radius: 50%; background: #2f9bff; color: #fff; font-size: 9px; display: inline-flex; align-items: center; justify-content: center; }
.pname { font-size: 13.5px; color: #1b1b21; margin-top: 2px; }
.rating { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: #8d93a1; margin-top: 4px; }
.star { color: #ff9d0a; }

/* иллюстрация авто (стилизация фото КМ/Ч UNI-K) */
.carimg { background: #fff; border: 1px solid #eef0f4; display: flex; flex-direction: column; position: relative; }
.carimg .brand { display: flex; align-items: center; gap: 5px; padding: 8px 10px 2px; font-size: 10px; font-weight: 800; letter-spacing: .8px; color: #1c3f94; }
.carimg .brand .v { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #1c3f94; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; }
.carimg .banner { margin: 4px 8px 0; background: #f08c1b; border-radius: 6px; color: #fff; font-weight: 900; text-align: center; padding: 8px 0 30px; font-size: 26px; letter-spacing: 1px; position: relative; overflow: visible; }
.carimg .banner .slash { position: absolute; right: 24%; top: -12px; width: 4px; height: 46px; background: #fff; transform: rotate(18deg); border-radius: 2px; }
.carimg svg.car { display: block; width: 86%; margin: -26px auto 0; position: relative; z-index: 2; }
.carimg .uni { text-align: center; font-weight: 900; font-style: italic; font-size: 22px; letter-spacing: 2px; color: #3f3a36; padding: 2px 0 4px; }
.carimg .dealer { text-align: center; font-size: 9.5px; color: #55565c; padding-bottom: 8px; }
.carimg.mini .banner { font-size: 15px; padding: 4px 0 18px; }
.carimg.mini svg.car { margin-top: -14px; }
.carimg.mini .uni { font-size: 12px; }
.carimg.mini .dealer { display: none; }
.carimg.mini .brand { font-size: 7px; padding: 5px 7px 0; }

.wb-btns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px; }
.tabbar { flex: 0 0 auto; border-top: 1px solid #eef0f4; display: flex; align-items: center; justify-content: space-around; padding: 8px 6px 2px; background: #fff; }
.tabbar .t { font-size: 21px; color: #55565c; position: relative; width: 44px; text-align: center; }
.tabbar .t.active { color: #a232e8; }
.tabbar .bank { background: #d8dae1; color: #fff; border-radius: 999px; font-size: 12.5px; font-weight: 600; padding: 6px 13px; }
.tabbar .cartdot { position: absolute; top: -4px; right: 4px; background: #e0334c; color: #fff; font-size: 9.5px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

/* карточка товара */
.hero { position: relative; }
.hero .ar { position: absolute; right: 14px; bottom: 40px; font-size: 18px; color: #33343c; }
.dots { display: flex; gap: 4px; padding: 10px 14px; align-items: center; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #d8dae1; }
.dots i.on { background: #33343c; }
.dots .sim { margin-left: auto; font-size: 14px; color: #33343c; }
.sect { background: #fff; border-radius: 16px; margin: 8px 12px 0; padding: 14px; }
.pgray { background: #f6f6f8; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 13px 14px; background: #fff; border-radius: 14px; margin: 8px 12px 0; font-size: 14.5px; cursor: pointer; }
.mrow .chev { margin-left: auto; color: #b6bac4; }
.tile2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 12px 0; }
.tile2 .mrow { margin: 0; }
.pay-badge { display: inline-flex; align-items: center; gap: 5px; background: #f0e4ff; color: #a232e8; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 6px 11px; margin-top: 8px; cursor: pointer; }
.color-pick { display: flex; flex-direction: column; gap: 5px; width: 74px; }
.color-pick .th { border: 2px solid #a232e8; border-radius: 12px; padding: 2px; }
.wheel-ic { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#b06cf0,#7d3ff2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; position: relative; flex: 0 0 auto; }
.wheel-ic .ok { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: #26ab5b; color: #fff; font-size: 6.5px; font-weight: 800; border-radius: 4px; padding: 1px 4px; letter-spacing: .2px; }

/* magenta кредитный лендинг */
.mag { background: linear-gradient(180deg, #ff0a92 0%, #f2007e 60%, #e60077 100%); min-height: 300px; color: #fff; }
.wb-credit-card { background: #fff; color: #1b1b21; border-radius: 20px 20px 0 0; margin-top: 36px; }
.step6 { display: flex; gap: 12px; padding: 9px 0; }
.step6 .n { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #17795c; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.benef { display: flex; gap: 12px; padding: 9px 0; }
.benef .ic { font-size: 19px; width: 26px; text-align: center; }
.finefoot { text-align: center; font-size: 11px; color: #8d93a1; padding: 8px 22px 4px; }

/* корзина */
.cart-addr { display: flex; gap: 10px; align-items: flex-start; }
.payways { display: flex; gap: 8px; overflow: hidden; margin-top: 10px; }
.payway { flex: 0 0 118px; border-radius: 14px; padding: 10px; font-size: 12px; border: 1.5px solid transparent; }
.payway b { display: block; font-size: 12.5px; }
.payway .ic { font-size: 16px; display: block; margin-bottom: 14px; }
.pw-wallet { background: #ffe9d6; }
.pw-partner { background: #f6f0ff; border-color: #a232e8; }
.pw-card { background: #f1f1f5; }
.totals div { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13.5px; }
.totals .t { font-size: 15px; font-weight: 700; padding-bottom: 6px; }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; margin-top: 12px; }
.cbx { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #c9cdd6; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; cursor: pointer; margin-top: 1px; }
.cbx.on { background: #a232e8; border-color: #a232e8; }

/* заказы */
.alert-orange { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; margin: 8px 12px 0; padding: 11px 12px; }
.alert-orange .i { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #ff7b1c; color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.alert-orange .go { margin-left: auto; flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #ffe9d6; color: #ff7b1c; display: flex; align-items: center; justify-content: center; }
.ord-plash { background: #fff; border-radius: 16px; margin: 8px 12px 0; padding: 14px; }
.ord-plash .carrow { display: flex; align-items: center; gap: 8px; color: #8d93a1; font-size: 13px; cursor: pointer; }
.ord-plash .carrow .sq { width: 18px; height: 18px; border-radius: 5px; background: #eceef2; }
.ord-plash .carrow .chev { margin-left: auto; color: #8d93a1; transition: transform .2s; }
.ord-plash h3 { font-size: 19px; margin-top: 8px; }
.ord-plash .desc { font-size: 13.5px; color: #43454d; margin-top: 6px; line-height: 1.45; }
.ord-photo { width: 96px; margin-top: 12px; cursor: pointer; }
.ord-price { font-size: 14px; font-weight: 600; margin-top: 6px; }
.transit { padding: 4px 12px 0; }
.transit h3 { font-size: 19px; padding: 14px 2px 8px; }
.tr-card { background: #fff; border-radius: 16px; padding: 12px; display: flex; gap: 8px; }
.tr-date { flex: 0 0 34px; text-align: center; }
.tr-date b { font-size: 17px; display: block; }
.tr-date span { font-size: 10.5px; color: #8d93a1; text-transform: lowercase; }
.tr-items { display: flex; gap: 8px; flex: 1; overflow: hidden; }
.tr-it { flex: 0 0 88px; }
.tr-it .im { height: 96px; border-radius: 10px; position: relative; overflow: hidden; }
.tr-it .sz { position: absolute; top: 5px; left: 5px; background: #fff; font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 4px; }
.tr-it .np { position: absolute; bottom: 5px; left: 5px; background: #ffd8de; color: #e0334c; font-size: 8.5px; font-weight: 800; border-radius: 4px; padding: 2px 4px; }
.tr-it .pr { font-size: 13px; font-weight: 700; margin-top: 5px; }
.tr-it .st { font-size: 11.5px; margin-top: 1px; }
.st-p { color: #a232e8; } .st-o { color: #ff7b1c; }
.pay-btn { background: #fff; color: #a232e8; border-radius: 14px; margin: 10px 12px 0; padding: 14px; text-align: center; font-weight: 600; font-size: 14.5px; cursor: pointer; }
.adbanner { margin: 10px 12px 12px; border-radius: 14px; overflow: hidden; background: #ffe712; display: flex; align-items: stretch; height: 84px; position: relative; }
.adbanner .ph { flex: 1; background: linear-gradient(120deg,#7fb069,#4c7a43); }
.adbanner .tx { flex: 1.3; padding: 8px 10px; font-weight: 900; font-size: 13px; line-height: 1.15; color: #111; }
.adbanner .k { font-size: 10px; background: #111; color: #ffe712; display: inline-block; padding: 1px 5px; border-radius: 3px; margin-bottom: 3px; }
.adbanner .off { position: absolute; right: 8px; bottom: 8px; background: #2fae4e; color: #fff; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 3px 6px; }
.adbanner .adlbl { position: absolute; right: 8px; top: 6px; font-size: 9px; color: #6a6a2e; }

/* детали заказа */
.det-thumb { width: 56px; border: 2px solid #a232e8; border-radius: 12px; padding: 2px; margin: 10px 12px 0; }
.det-prod { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 16px; margin: 10px 12px 0; padding: 12px; }
.det-prod .sq { flex: 0 0 54px; height: 54px; border-radius: 10px; background: #f1f1f5; }
.bdg-kredit { background: #dff1fd; color: #2f9bff; font-size: 10.5px; font-weight: 800; border-radius: 5px; padding: 2px 6px; vertical-align: 2px; }
.trackline { background: #f6f6f8; border-radius: 14px; padding: 14px; margin-top: 10px; }
.trackline .ics { display: flex; align-items: center; justify-content: center; gap: 0; }
.trackline .ic { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #a232e8; }
.trackline .ln { width: 46px; height: 2px; background: #e3e5ea; }
.trackline .cap { display: flex; justify-content: space-between; font-size: 12.5px; margin-top: 12px; color: #43454d; }
.det-row { display: flex; align-items: center; padding: 13px 2px; font-size: 14.5px; border-bottom: 1px solid #f1f1f5; cursor: pointer; }
.det-row .chev { margin-left: auto; color: #b6bac4; }
.two-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pickcards { display: flex; gap: 8px; padding: 0 12px 12px; }
.pickcards .pc { flex: 1; height: 92px; border-radius: 12px; background: linear-gradient(120deg,#d9c6b4,#b39f8c); position: relative; }
.pickcards .pc .h { position: absolute; top: 6px; right: 8px; color: #fff; }

/* ============ сайт ОФМ ============ */
.site { background: #f2f3f6; flex: 1; display: flex; flex-direction: column; }
.site-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; background: #f8f8fa; }
.wb-logo { background: linear-gradient(90deg,#c711d6,#a232e8); color: #fff; font-weight: 700; font-size: 13.5px; border-radius: 999px; padding: 6px 14px; font-style: italic; letter-spacing: .2px; }
.ofm-logo { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 15px; color: #23252b; }
.ofm-logo .o { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #14b86e; border-right-color: #f2007e; transform: rotate(35deg); }
.site-body { padding: 0 16px 24px; }
.site h1 { font-size: 23px; line-height: 1.2; padding-top: 12px; }
.site .sub { color: #55565c; font-size: 14px; margin-top: 6px; }
.stepmeta { color: #8d93a1; font-size: 13px; padding-top: 14px; }
.scard { background: #fff; border-radius: 18px; padding: 16px; margin-top: 14px; }
.scard h2 { font-size: 17px; }
.scard .hint { font-size: 12.5px; color: #8d93a1; margin-top: 2px; }
.gfield { background: #f2f3f6; border-radius: 12px; padding: 9px 14px 10px; margin-top: 12px; position: relative; }
.gfield label { display: block; font-size: 11.5px; color: #8d93a1; }
.gfield input, .gfield select { border: none; outline: none; background: transparent; font-size: 15.5px; font-weight: 600; font-family: inherit; width: 100%; margin-top: 2px; color: #1b1b21; appearance: none; }
.gfield .rub { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #8d93a1; }
.gfield.err { outline: 1.5px solid #e0334c; }
.ofield { border: 1.5px solid #d9dce3; border-radius: 12px; padding: 8px 14px 9px; margin-top: 12px; position: relative; background: #fff; }
.ofield label { position: absolute; top: -7px; left: 12px; background: #fff; padding: 0 4px; font-size: 11px; color: #8d93a1; }
.ofield input, .ofield select { border: none; outline: none; font-size: 15px; font-family: inherit; width: 100%; background: transparent; appearance: none; color: #1b1b21; }
.ofield .chev, .gfield .chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #8d93a1; pointer-events: none; }
.ofield.err { border-color: #e0334c; }
.fhint { font-size: 12px; color: #8d93a1; margin-top: 6px; padding-left: 2px; }
.termchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.termchips .tc { border-radius: 999px; background: #f2f3f6; padding: 10px 16px; font-size: 13.5px; cursor: pointer; border: 1.5px solid transparent; }
.termchips .tc.on { background: #fff; border-color: #b769f2; color: #9a27f5; font-weight: 600; }
.payblock { background: #f2f3f6; border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
.payblock .lbl { font-size: 12px; color: #8d93a1; }
.payblock .val { font-size: 18px; font-weight: 700; margin-top: 2px; }
.legal { font-size: 12px; color: #8d93a1; margin-top: 12px; line-height: 1.45; }
.site-foot { background: #fff; margin-top: 22px; padding: 18px 16px 26px; font-size: 12px; color: #8d93a1; line-height: 1.5; }
.gos-ic { width: 26px; height: 26px; background: #fff; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }

function qrSVG(){
  // детерминированный псевдо-QR
  let cells = '';
  let seed = 7;
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++){
    seed = (seed * 137 + x * 31 + y * 17 + 13) % 289;
    const corner = (x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    if (corner) continue;
    if (seed % 5 < 2) cells += `<rect x="${x*8}" y="${y*8}" width="8" height="8"/>`;
  }
  const eye = (cx,cy)=>`<rect x="${cx}" y="${cy}" width="56" height="56" fill="none" stroke="#111" stroke-width="10"/><rect x="${cx+18}" y="${cy+18}" width="20" height="20"/>`;
  return `<svg viewBox="0 0 168 168" fill="#111" shape-rendering="crispEdges">${eye(5,5)}${eye(107,5)}${eye(5,107)}${cells}</svg>`;
}

/* подпись на canvas */
let signDrawn = false;
function initSign(){
  const cv = document.getElementById('signcv');
  if (!cv) return;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * 2; cv.height = r.height * 2;
  const ctx = cv.getContext('2d');
  ctx.scale(2,2); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#2c3550';
  let drawing = false, px = 0, py = 0;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { drawing = true; [px,py] = pos(e); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => {
    if (!drawing) return;
    const [x,y] = pos(e);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
    px = x; py = y;
    if (!signDrawn){ signDrawn = true;
      document.getElementById('signph').style.display = 'none';
      document.getElementById('signok').disabled = false; }
  };
  cv.onpointerup = () => drawing = false;
  signDrawn = false;
}
function signClear(){
  const cv = document.getElementById('signcv');
  if (cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  signDrawn = false;
  const ph = document.getElementById('signph'); if (ph) ph.style.display = 'flex';
  const ok = document.getElementById('signok'); if (ok) ok.disabled = true;
}

function codeInput(i, el){
  el.value = el.value.replace(/\D/g,'');
  if (el.value && i < 3) document.getElementById('code'+(i+1))?.focus();

  if (full) setTimeout(()=> setModal('bank-wait'), 250);
}
