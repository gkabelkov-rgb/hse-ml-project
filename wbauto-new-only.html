<!-- WB Авто · Страница Сервиса «Автомобили» · интерактивный макет по БТ V2 от 23.07.2026 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WB Авто — Новые автомобили</title>
<style>
/* ============================== ВЕРСТАК (вокруг телефона) ============================== */
:root{
  --wk-bg:#ECEAF2; --wk-panel:#FFFFFF; --wk-ink:#231F30; --wk-ink2:#726E82;
  --wk-line:#DEDAE8; --wk-accent:#CB11AB; --wk-chipbg:#F4F1FA; --wk-code:#F6F3FB;
}
@media (prefers-color-scheme: dark){
  :root{ --wk-bg:#16131D; --wk-panel:#211D2C; --wk-ink:#EFEDF6; --wk-ink2:#9B96AC;
         --wk-line:#37324A; --wk-chipbg:#2B2638; --wk-code:#1B1826; }
}
:root[data-theme="dark"]{ --wk-bg:#16131D; --wk-panel:#211D2C; --wk-ink:#EFEDF6; --wk-ink2:#9B96AC;
         --wk-line:#37324A; --wk-chipbg:#2B2638; --wk-code:#1B1826; }
:root[data-theme="light"]{ --wk-bg:#ECEAF2; --wk-panel:#FFFFFF; --wk-ink:#231F30; --wk-ink2:#726E82;
         --wk-line:#DEDAE8; --wk-chipbg:#F4F1FA; --wk-code:#F6F3FB; }

*{box-sizing:border-box; margin:0}
html,body{background:var(--wk-bg); color:var(--wk-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit}
svg{display:block}

.wk-header{max-width:1280px; margin:0 auto; padding:22px 24px 6px; display:flex; flex-wrap:wrap; gap:12px; align-items:baseline}
.wk-header h1{font-size:20px; font-weight:800; letter-spacing:-.2px}
.wk-header .sub{color:var(--wk-ink2); font-size:13px}
.wk-header .spacer{flex:1}
.wk-toggle{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--wk-ink2);
  background:var(--wk-panel); border:1px solid var(--wk-line); border-radius:99px; padding:7px 14px}
.wk-toggle .dot{width:30px; height:17px; border-radius:99px; background:var(--wk-line); position:relative; transition:background .15s}
.wk-toggle .dot::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
.wk-toggle.on{color:var(--wk-accent)}
.wk-toggle.on .dot{background:var(--wk-accent)}
.wk-toggle.on .dot::after{left:15px}

.stage{max-width:1280px; margin:0 auto; padding:14px 24px 48px; display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:24px; align-items:start}
@media (max-width:1024px){ .stage{grid-template-columns:1fr} .sidebar{order:2} }

/* Боковая панель */
.sidebar{display:flex; flex-direction:column; gap:14px; position:sticky; top:14px}
@media (max-width:1024px){ .sidebar{position:static} }
.panel{background:var(--wk-panel); border:1px solid var(--wk-line); border-radius:16px; padding:14px 16px}
.panel h3{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--wk-ink2); margin-bottom:10px; font-weight:700}
.navgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.navbtn{border:1px solid var(--wk-line); border-radius:10px; padding:8px 10px; font-size:12.5px; font-weight:600; text-align:left; transition:border-color .12s, color .12s}
.navbtn:hover{border-color:var(--wk-accent)}
.navbtn.active{border-color:var(--wk-accent); color:var(--wk-accent)}
.navbtn small{display:block; font-weight:500; color:var(--wk-ink2); font-size:10.5px; margin-top:2px}
.ctx-row{font-size:12px; display:flex; gap:8px; margin-bottom:6px; align-items:baseline}
.ctx-row b{flex:none; width:88px; color:var(--wk-ink2); font-weight:600}
.ctx-row code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; word-break:break-all; background:var(--wk-code); border-radius:6px; padding:2px 6px}
.evlog{max-height:240px; overflow:auto; display:flex; flex-direction:column; gap:5px}
.evlog .ev{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.8px; line-height:1.45; background:var(--wk-code); border-radius:8px; padding:5px 8px; word-break:break-word}
.evlog .ev b{color:var(--wk-accent); font-weight:700}
.crmbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.8px; line-height:1.5; background:var(--wk-code); border-radius:10px; padding:10px; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto}
.hint{font-size:12px; color:var(--wk-ink2); line-height:1.5}

/* ============================== ТЕЛЕФОН ============================== */
.phone-zone{display:flex; justify-content:center}
.phone{width:393px; max-width:100%; height:832px; background:#14121A; border-radius:52px; padding:10px; box-shadow:0 24px 60px rgba(20,10,40,.35); position:relative; flex:none}
.phone-inner{position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column}

/* WB-токены экрана — тёмная тема приложения */
.phone-inner{
  --bg:#131118; --card:#1F1C27; --ink:#F0EEF6; --ink2:#9B96AA; --ink3:#565064;
  --brand:#E135C6; --brand-grad:linear-gradient(100deg,#CB11AB 0%,#9A1FE8 55%,#7C1AF5 100%);
  --violet:#A78BFA; --lav:#2C2440; --lav2:#3A3153; --star:#FF9E00; --green:#4ADE80; --red:#FF5C7A;
  --line:#2B2836; --chip:#282430;
  color:var(--ink); font-size:14px;
}
.statusbar{flex:none; height:34px; display:flex; align-items:center; justify-content:space-between; padding:8px 26px 0; font-size:13px; font-weight:700; background:var(--card); z-index:30; position:relative}
.statusbar .sb-ic{display:flex; gap:5px; align-items:center}
.notch{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:118px; height:26px; background:#14121A; border-radius:16px; z-index:40}

.chrome{flex:none; background:var(--card); z-index:20; position:relative}
.topbar{height:48px; display:flex; align-items:center; gap:4px; padding:0 8px}
.topbar .tb-title{flex:1; text-align:center; font-size:16.5px; font-weight:800; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.icbtn{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--ink); flex:none}
.icbtn:active{background:var(--chip)}
.paramsrow{padding:12px 14px 2px; position:relative}
.params-btn{width:100%; height:46px; border-radius:23px; background:var(--brand-grad); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; letter-spacing:.1px; box-shadow:0 6px 16px rgba(160,20,200,.28)}
.params-btn:active{transform:translateY(1px)}

.scroll{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; overscroll-behavior:contain; scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll-pad{padding-bottom:96px}
.scroll.no-cta .scroll-pad{padding-bottom:28px} /* отступ под кнопку-оверлей FE-08 */

/* Кнопка-оверлей FE-08 */
.cta-overlay{position:absolute; left:0; right:0; bottom:0; padding:10px 14px 20px; z-index:25;
  background:linear-gradient(180deg, rgba(19,17,24,0) 0%, rgba(19,17,24,.9) 38%, #131118 100%); pointer-events:none}
.cta-overlay .cta{pointer-events:auto; width:100%; height:52px; border-radius:15px; background:var(--brand-grad); color:#fff; font-size:16px; font-weight:800; letter-spacing:.1px; box-shadow:0 8px 22px rgba(160,20,200,.35); display:flex; align-items:center; justify-content:center; gap:8px}
.cta-overlay .cta:active{transform:translateY(1px)}
.cta-overlay .cta:disabled{opacity:.5; box-shadow:none; cursor:default}
.cta-overlay .cta:disabled:active{transform:none}


/* Подсказки поиска */
.sug{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.sug button{text-align:left; background:var(--card); border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600; color:var(--ink); display:flex; gap:10px; align-items:center}
.sug button svg{color:var(--ink2); flex:none}
.sug .sug-sub{margin-left:auto; font-size:11.5px; color:var(--ink2); font-weight:600; font-variant-numeric:tabular-nums}

/* Подвитрина «Проверенные авто с пробегом» и чёрная полка «Все авто» */
.subvitrine{background:#1C1924; border:1px solid #2E2A3A; border-radius:24px; margin:16px 8px 0; padding:14px 0 6px; overflow:hidden}
.subv-head{font-size:18px; font-weight:800; letter-spacing:-.3px; padding:0 14px}
.subvitrine .shelf.accent{margin:12px 8px 4px}
.subvitrine .teasers-wrap{margin-top:12px; padding-bottom:10px}
.shelf.black{background:#000; border-radius:24px; margin:16px 8px 0; padding:4px 0 12px}
.shelf.black .sh-t{color:#fff}
.shelf.black .more{color:#D9A7F5}

/* Переключатель витрин «Новые авто / С пробегом» */
.mkt-toggle{display:flex; gap:6px; background:var(--chip); border-radius:14px; padding:4px; margin:10px 14px 2px}
.mkt-btn{flex:1; height:40px; border-radius:11px; font-size:14px; font-weight:700; color:var(--ink2); transition:all .15s}
.mkt-btn.on{background:var(--brand-grad); color:#fff; box-shadow:0 4px 12px rgba(160,20,200,.3)}

/* Карусель FE-03 */
.carousel-wrap{padding:10px 0 2px}
.carousel{display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 14px; scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:none; width:calc(100% - 56px); scroll-snap-align:center; border-radius:18px; height:150px; position:relative; overflow:hidden; color:#fff; text-align:left; padding:16px 18px; display:flex; flex-direction:column; justify-content:flex-start}
.slide .s-kick{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; opacity:.85; margin-bottom:6px}
.slide .s-title{font-size:17.5px; font-weight:800; line-height:1.2; letter-spacing:-.2px; max-width:75%; text-wrap:balance}
.slide .s-sub{font-size:11.5px; margin-top:6px; opacity:.9; max-width:62%; line-height:1.35}
.slide .s-art{position:absolute; right:-24px; bottom:-14px; width:170px; opacity:.96}
.dots{display:flex; gap:5px; justify-content:center; padding:9px 0 2px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--ink3); transition:all .2s}
.dots i.on{background:var(--brand); width:16px; border-radius:99px}

/* Полки FE-04 */
.shelf{margin-top:8px}
.shelf.accent{background:linear-gradient(140deg,#4C1D95 0%,#7C1AF5 140%); border-radius:20px; margin:12px 8px 4px; padding:2px 0 12px}
.shelf.accent .sh-t, .shelf.accent .sh-sub{color:#fff}
.shelf.accent .more{color:#EBD9FF}
.shelf-head{display:flex; align-items:baseline; padding:8px 14px 8px; gap:8px}
.shelf-head .sh-t{font-size:17px; font-weight:800; letter-spacing:-.2px}
.shelf-head .sh-sub{display:block; font-size:12px; color:var(--ink2); font-weight:500; margin-top:2px}
.shelf-head .more{margin-left:auto; color:var(--brand); font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:2px; flex:none}
.shelf-row{display:flex; gap:8px; overflow-x:auto; padding:2px 14px 6px; scrollbar-width:none}
.shelf-row::-webkit-scrollbar{display:none}
.shelf-row .snippet{width:152px; flex:none}

/* Сниппет FE-05 */
.snippet{background:var(--card); border-radius:14px; overflow:hidden; text-align:left; display:flex; flex-direction:column; position:relative}
.snippet .ph{position:relative; aspect-ratio:4/3.4; background:var(--ph-bg,linear-gradient(160deg,#EDEBF4,#DCD8E9)); display:flex; align-items:center; justify-content:center; overflow:hidden}
.snippet .ph svg.car{width:88%; height:auto; filter:drop-shadow(0 7px 8px rgba(30,20,60,.25))}
.snippet .disc{position:absolute; top:8px; left:8px; background:var(--red); color:#fff; font-size:10.5px; font-weight:800; border-radius:7px; padding:2px 6px}
.snippet .fav{position:absolute; top:6px; right:6px; color:#fff; opacity:.9}
.snippet .body{padding:8px 10px 10px; display:flex; flex-direction:column; gap:3px; flex:1}
.wallet{color:var(--brand); font-weight:800; font-size:15px; line-height:1.1; font-variant-numeric:tabular-nums}
.wallet small{display:block; font-weight:600; font-size:9.5px; letter-spacing:.02em; margin-top:2px}
.priceline{display:flex; gap:6px; align-items:baseline; font-variant-numeric:tabular-nums}
.priceline .p{font-weight:600; font-size:12px; color:var(--ink)}
.priceline .old{font-size:11px; color:var(--ink3); text-decoration:line-through}
.snippet .nm{font-size:12.5px; color:var(--ink); line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.snippet .nm b{font-weight:700}
.rate{display:flex; align-items:center; gap:3px; font-size:11.5px; color:var(--ink2); font-weight:600}
.rate .st{color:var(--star)}
.badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px}
.badge{font-size:9.6px; font-weight:700; border-radius:6px; padding:2.5px 6px; line-height:1.1}
.badge.credit{background:var(--lav); color:var(--violet)}
.badge.gos{background:#14301F; color:var(--green)}
.badge.excl{background:#3A1030; color:#F284DC}
.badge.wbcheck{background:#12263F; color:#60A5FA}
.deliv{margin-top:6px; background:var(--lav); color:var(--violet); font-size:11px; font-weight:700; border-radius:9px; padding:6px 8px; text-align:center}

/* Тизеры — низкие широкие скроллящиеся плашки (референс «сделано дома») FE-06 */
.teasers-wrap{margin-top:16px; position:relative}
.teasers{display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 14px; scrollbar-width:none}
.teasers::-webkit-scrollbar{display:none}
.teaser{flex:none; width:calc(100% - 52px); scroll-snap-align:center; height:92px; border-radius:22px; position:relative; overflow:hidden; color:#fff; text-align:left; padding:0 18px; display:flex; flex-direction:column; justify-content:center}
.teaser b{font-size:16px; font-weight:800; letter-spacing:-.2px; max-width:60%; line-height:1.22; position:relative; z-index:1; display:block; text-wrap:balance}
.teaser small{display:block; font-size:10.5px; font-weight:600; opacity:.85; margin-top:4px; position:relative; z-index:1}
.teaser .t-art{position:absolute; right:-10px; bottom:-10px; width:120px; opacity:.95}
.teaser:active{transform:translateY(1px)}
/* Коллекция отраслевых подборок — квадратные тайлы с подписью под ними */
.coll{display:flex; gap:8px; overflow-x:auto; padding:2px 14px 4px; scrollbar-width:none}
.coll::-webkit-scrollbar{display:none}
.coll-item{flex:0 0 calc((100% - 16px)/3); min-width:0; text-align:center}
.coll-tile{width:100%; height:58px; border-radius:16px; background:linear-gradient(165deg,#262130,#332B45); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden}
.coll-tile svg.cc-art{width:64%; max-width:86px; filter:drop-shadow(0 4px 5px rgba(80,30,160,.25))}
.coll-tile .cc-ic{display:flex; align-items:center; justify-content:center; color:#7C3AED; filter:drop-shadow(0 3px 4px rgba(80,30,160,.22))}
.coll-tile .cc-badge{position:absolute; top:5px; right:5px; width:19px; height:19px; border-radius:50%; background:var(--brand-grad); color:#fff; display:flex; align-items:center; justify-content:center}
.coll-item .cc-cap{display:block; font-size:10.5px; font-weight:600; color:var(--ink); line-height:1.25; margin-top:5px}

/* Лента «Рекомендуем» FE-07 */
.feed-head{padding:18px 14px 8px; font-size:19px; font-weight:800; letter-spacing:-.3px}
.feed{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 14px}
.feed-note{padding:10px 14px 0; color:var(--ink2); font-size:11.5px; text-align:center}

/* Листинг FE-09 */
.chipsrow{display:flex; gap:6px; overflow-x:auto; padding:8px 12px 10px; background:var(--card); scrollbar-width:none; align-items:center}
.chipsrow::-webkit-scrollbar{display:none}
.chip{flex:none; display:flex; align-items:center; gap:6px; background:var(--lav); color:var(--violet); border-radius:99px; padding:7px 8px 7px 12px; font-size:12.5px; font-weight:700}
.chip .x{width:16px; height:16px; border-radius:50%; background:rgba(124,26,245,.14); display:flex; align-items:center; justify-content:center; color:var(--violet)}
.chip.query{background:#3A1030; color:#F284DC}
.chip.query .x{background:rgba(226,53,198,.2); color:#F284DC}
.toolrow{display:flex; align-items:center; gap:14px; padding:8px 14px; background:var(--card); border-bottom:1px solid var(--line)}
.toolrow .tool{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--ink)}
.toolrow .cnt-label{margin-left:auto; font-size:12px; color:var(--ink2); font-weight:500}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 0}
.empty{padding:60px 30px; text-align:center}
.empty .e-ic{font-size:44px}
.empty h4{font-size:16px; font-weight:800; margin-top:12px}
.empty p{font-size:13px; color:var(--ink2); margin-top:6px; line-height:1.45}
.empty .btn{margin-top:16px; display:inline-flex; height:44px; padding:0 22px; border-radius:12px; background:var(--brand-grad); color:#fff; font-weight:800; align-items:center}

/* Промо FE-10 */
.hero{margin:0; padding:26px 20px 20px; color:#fff; background:linear-gradient(155deg,#3A0B63 0%,#7C1AF5 55%,#CB11AB 130%); position:relative; overflow:hidden}
.hero .h-kick{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; opacity:.8}
.hero h2{font-size:25px; font-weight:800; line-height:1.13; letter-spacing:-.4px; margin-top:8px; max-width:88%; text-wrap:balance}
.hero p{font-size:13.5px; margin-top:10px; opacity:.92; max-width:80%; line-height:1.45}
.hero .h-art{margin:14px auto 0; width:238px; display:block; filter:drop-shadow(0 16px 22px rgba(0,0,0,.4))}
.sec{padding:22px 14px 0}
.sec > h3{font-size:19px; font-weight:800; letter-spacing:-.3px; margin-bottom:12px}
.utp{display:flex; flex-direction:column; gap:8px}
.utp .u-card{background:var(--card); border-radius:16px; padding:14px; display:flex; gap:12px}
.utp .u-n{flex:none; width:32px; height:32px; border-radius:10px; background:var(--lav); color:var(--violet); font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center}
.utp b{font-size:13.5px; display:block; line-height:1.3}
.utp span{font-size:12px; color:var(--ink2); line-height:1.45; display:block; margin-top:3px}
.benef{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.benef .b-card:last-child:nth-child(odd){grid-column:1/-1}
.benef .b-card{background:var(--card); border-radius:14px; padding:12px}
.benef .b-ic{font-size:20px}
.benef b{display:block; font-size:12.5px; line-height:1.3; margin-top:6px}
.benef span{display:block; font-size:11px; color:var(--ink2); line-height:1.4; margin-top:3px}
.offers{display:flex; flex-direction:column; gap:8px}
.offer{background:var(--card); border-radius:18px; padding:16px; display:flex; align-items:center; gap:12px; text-align:left; width:100%}
.offer .o-art{flex:none; width:74px; height:74px; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden}
.offer .o-art svg{width:82%}
.offer b{display:block; font-size:14.5px; letter-spacing:-.1px}
.offer span{display:block; font-size:11.8px; color:var(--ink2); margin-top:3px; line-height:1.4}
.offer .chev{margin-left:auto; color:var(--ink3); flex:none}
.faq{display:flex; flex-direction:column; gap:6px}
.faq .q{background:var(--card); border-radius:14px; overflow:hidden}
.faq .q > button{width:100%; display:flex; align-items:center; gap:10px; padding:13px 14px; font-size:13.5px; font-weight:700; text-align:left; color:var(--ink)}
.faq .q .chev{margin-left:auto; color:var(--ink3); transition:transform .2s; flex:none}
.faq .q.open .chev{transform:rotate(180deg)}
.faq .a{display:none; padding:0 14px 13px; font-size:12.5px; color:var(--ink2); line-height:1.5}
.faq .q.open .a{display:block}

/* Трейд-ин FE-11 */
.steps{display:flex; flex-direction:column; gap:0}
.step{display:flex; gap:12px; position:relative; padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:15px; top:34px; bottom:2px; width:2px; background:var(--lav2)}
.step:last-child::before{display:none}
.step .s-n{flex:none; width:32px; height:32px; border-radius:50%; background:var(--brand-grad); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:1}
.step b{display:block; font-size:13.5px; line-height:1.3; padding-top:6px}
.step span{display:block; font-size:12px; color:var(--ink2); line-height:1.45; margin-top:3px}

/* Промо-экран трейд-ина FE-11 (CarPrice) */
.ti-hero{margin:0; padding:14px 18px 20px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(168deg,#3F2306 0%,#8A5410 52%,#D89A2B 135%); border-radius:0 0 24px 24px}
.ti-hero .partner{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.94); color:#1E1B26; border-radius:99px; padding:6px 12px; font-size:12px; font-weight:800}
.ti-hero .partner .dot{width:9px; height:9px; border-radius:50%; background:#F25C1F}
.ti-hero h2{font-size:23px; font-weight:800; line-height:1.15; letter-spacing:-.4px; margin-top:12px; max-width:92%; text-wrap:balance}
.ti-hero p{font-size:13px; margin-top:8px; opacity:.92; max-width:86%; line-height:1.45}
.ti-hero .h-art{position:absolute; right:-14px; top:-2px; width:120px; opacity:.9}
.cardbox{background:var(--card); border-radius:20px; padding:16px 14px; position:relative}
.tabs{display:flex; gap:6px; background:var(--chip); padding:4px; border-radius:13px; margin-bottom:12px}
.tab{flex:1; height:34px; border-radius:10px; font-size:11.5px; font-weight:700; color:var(--ink2); display:flex; align-items:center; justify-content:center; white-space:nowrap; transition:all .12s}
.tab.on{background:var(--lav2); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.3)}
.fld .note{display:block; font-size:10.5px; color:var(--ink2); margin-top:4px; line-height:1.4}
.fld .fmsg{display:none; font-size:11px; color:var(--red); margin-top:4px; line-height:1.4}
.fld.showerr .fmsg{display:block}
.fld{position:relative}
.plate-ok{position:absolute; right:12px; top:38px; color:var(--green); display:none}
.fld.valid .plate-ok{display:block}
.agree > span{flex:1; min-width:0}
.form-alert{display:none; background:#3A1220; color:#FF8AA0; border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.45; margin-bottom:10px}
.form-alert.show{display:block}
.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:tispin .7s linear infinite}
@keyframes tispin{to{transform:rotate(360deg)}}
.result{text-align:center; padding:6px 4px}
.result .r-badge{display:inline-flex; align-items:center; gap:6px; background:#14301F; color:var(--green); border-radius:99px; padding:5px 12px; font-size:11.5px; font-weight:700}
.result .r-sum{font-size:21.5px; font-weight:800; letter-spacing:-.4px; margin-top:12px; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums}
.result .r-car{font-size:13px; color:var(--ink2); margin-top:6px}
.result .r-note{font-size:11.5px; color:var(--ink2); margin-top:10px; line-height:1.5; padding:0 10px}
.result .r-save{margin-top:12px; background:var(--lav); color:var(--violet); border-radius:12px; padding:9px 12px; font-size:11.5px; font-weight:600; line-height:1.4}
.ti-benef .b-card{background:var(--card); border-radius:16px; padding:13px 14px; display:flex; gap:12px; align-items:flex-start}
.ti-benef{display:flex; flex-direction:column; gap:8px}
.ti-benef .b-ic2{flex:none; width:40px; height:40px; border-radius:12px; background:var(--lav); color:var(--violet); display:flex; align-items:center; justify-content:center; font-size:19px}
.ti-benef b{display:block; font-size:13.5px; line-height:1.3}
.ti-benef span{display:block; font-size:12px; color:var(--ink2); line-height:1.45; margin-top:3px}
.disclaimer{padding:16px 20px 4px; font-size:10px; color:var(--ink3); line-height:1.5; text-align:center}

/* Карточка авто (заглушка) */
.card-hero{background:var(--card); padding:8px 0 14px}
.card-hero .ph-big{margin:0 14px; aspect-ratio:4/2.9; border-radius:18px; display:flex; align-items:center; justify-content:center; background:var(--ph-bg,linear-gradient(160deg,#EDEBF4,#DCD8E9)); overflow:hidden}
.card-hero .ph-big svg{width:82%; filter:drop-shadow(0 12px 14px rgba(30,20,60,.3))}
.card-info{padding:14px}
.card-info .wallet{font-size:22px}
.card-info .priceline .p{font-size:15px}
.card-info h2{font-size:18px; font-weight:800; margin-top:6px; letter-spacing:-.2px}
.spec{background:var(--card); border-radius:16px; margin:4px 14px; padding:6px 14px}
.spec .row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px}
.spec .row:last-child{border-bottom:none}
.spec .row span{color:var(--ink2)}
.spec .row b{font-weight:600; text-align:right}

/* Шторки */
.sheet-back{position:absolute; inset:0; background:rgba(20,12,35,.5); opacity:0; transition:opacity .2s; z-index:50}
.sheet-back.show{opacity:1}
.sheet{position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:24px 24px 0 0; z-index:51; transform:translateY(102%); transition:transform .26s cubic-bezier(.32,.72,.33,1); max-height:88%; display:flex; flex-direction:column; overflow:hidden}
.sheet.show{transform:translateY(0)}
.sheet .grab{flex:none; padding:8px 0 2px; display:flex; justify-content:center}
.sheet .grab i{width:38px; height:4px; border-radius:99px; background:var(--ink3)}
.sheet .sh-head{flex:none; display:flex; align-items:center; padding:6px 14px 10px; gap:10px}
.sheet .sh-head h3{font-size:17px; font-weight:800; flex:1; letter-spacing:-.2px}
.sheet .sh-head .lnk{color:var(--brand); font-size:13px; font-weight:700; flex:none}
.sheet .sh-body{flex:1; overflow-y:auto; padding:0 14px; scrollbar-width:none}
.sheet .sh-body::-webkit-scrollbar{display:none}
.sheet .sh-foot{flex:none; padding:10px 14px calc(14px + env(safe-area-inset-bottom,6px)); background:linear-gradient(180deg,rgba(19,17,24,0),var(--bg) 40%)}
.btn-primary{width:100%; height:50px; border-radius:14px; background:var(--brand-grad); color:#fff; font-size:15.5px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:8px}
.btn-primary:disabled{opacity:.55}
.btn-ghost{width:100%; height:46px; border-radius:13px; background:var(--chip); color:var(--ink); font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:8px}

/* Фильтры */
.fgroup{padding:12px 0; border-bottom:1px solid var(--line)}
.fgroup:last-child{border-bottom:none}
.fgroup > b{display:block; font-size:14px; font-weight:800; margin-bottom:10px}
.fchips{display:flex; flex-wrap:wrap; gap:6px}
.fchip{border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--ink); transition:all .12s}
.fchip.on{border-color:var(--brand); color:#F284DC; background:#3A1030}
.fchip:disabled{opacity:.4; cursor:default}
.frange{display:flex; gap:8px}
.frange label{flex:1; display:flex; align-items:center; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:0 12px; height:44px; gap:6px; font-size:12px; color:var(--ink2)}
.frange input{border:none; outline:none; background:none; width:100%; font-size:14px; font-weight:700; color:var(--ink); min-width:0}
.fswitch{display:flex; align-items:center; justify-content:space-between; gap:10px}
.fswitch b{font-size:14px; font-weight:800}
.fswitch small{display:block; font-weight:500; color:var(--ink2); font-size:11.5px; margin-top:2px}
.sw{flex:none; width:46px; height:27px; border-radius:99px; background:var(--line); position:relative; transition:background .15s}
.sw::after{content:""; position:absolute; top:2.5px; left:2.5px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s}
.sw.on{background:var(--brand)}
.sw.on::after{left:21.5px}

/* Чат FE-12 */
.chat-body{display:flex; flex-direction:column; gap:8px; padding-top:4px}
.msg{max-width:82%; border-radius:16px; padding:10px 13px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word}
.msg.user{align-self:flex-end; background:var(--brand-grad); color:#fff; border-bottom-right-radius:5px}
.msg.mgr{align-self:flex-start; background:var(--card); border-bottom-left-radius:5px}
.msg .t{display:block; font-size:10px; opacity:.65; margin-top:4px; text-align:right}
.chat-note{text-align:center; font-size:11px; color:var(--ink2); padding:4px 20px; line-height:1.4}
.chat-input{display:flex; gap:8px; align-items:flex-end}
.chat-input textarea{flex:1; resize:none; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:11px 13px; font-size:13.5px; line-height:1.4; outline:none; color:var(--ink); max-height:120px}
.chat-input textarea:focus{border-color:var(--brand)}
.sendbtn{flex:none; width:46px; height:46px; border-radius:50%; background:var(--brand-grad); color:#fff; display:flex; align-items:center; justify-content:center}
.sendbtn:disabled{opacity:.45}
.mgr-head{display:flex; gap:10px; align-items:center}
.mgr-head .ava{width:40px; height:40px; border-radius:50%; background:var(--brand-grad); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; flex:none}
.mgr-head b{display:block; font-size:14.5px}
.mgr-head small{display:block; color:var(--green); font-size:11.5px; font-weight:600; margin-top:1px}

/* Форма «Ваши контакты» */
.fld{display:block; margin-bottom:10px}
.fld span{display:block; font-size:12px; color:var(--ink2); font-weight:600; margin-bottom:5px}
.fld input{width:100%; height:48px; border:1.5px solid var(--line); border-radius:13px; background:var(--card); padding:0 14px; font-size:15px; font-weight:600; color:var(--ink); outline:none}
.fld input:focus{border-color:var(--brand)}
.fld input.err{border-color:var(--red)}
.agree{display:flex; gap:9px; font-size:11.5px; color:var(--ink2); line-height:1.45; margin:4px 0 6px; align-items:flex-start}
.agree input{margin-top:2px; accent-color:var(--brand)}
.success{padding:26px 18px 10px; text-align:center}
.success .s-ic{width:74px; height:74px; margin:0 auto; border-radius:50%; background:#14301F; color:var(--green); display:flex; align-items:center; justify-content:center}
.success h3{font-size:19px; font-weight:800; margin-top:16px; letter-spacing:-.2px}
.success p{font-size:13px; color:var(--ink2); margin-top:8px; line-height:1.5}
.success .rid{margin-top:12px; display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; background:var(--chip); border-radius:8px; padding:5px 10px; color:var(--ink2)}

/* Аннотации */
.ann{display:none; position:relative; z-index:5}
.wk-ann-on .ann{display:inline-flex}
.ann-tag{align-items:center; gap:4px; background:#123; background:rgba(15,23,42,.86); color:#7FF3C4; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:9px; font-weight:600; line-height:1; border-radius:6px; padding:3.5px 6px; letter-spacing:.02em; white-space:nowrap; pointer-events:none}
.ann-tag.ep{color:#FFD37F}
.ann-abs{position:absolute; z-index:6}
.ann-block{display:none; margin:6px 14px 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:9.5px; line-height:1.5; color:#0E7A54; background:#E6F7EF; border:1px dashed #74C9A4; border-radius:8px; padding:6px 9px; word-break:break-word}
.wk-ann-on .ann-block{display:block}
.ann-inline-wrap{position:relative}
.ann-inline-wrap .ann-abs{top:6px; left:20px}

/* Панели «Комментарии» и «Примеры визуализации» */
.tgt-chip{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--wk-accent); background:var(--wk-chipbg); border-radius:99px; padding:4px 10px; margin-bottom:9px}
.cm-list{display:flex; flex-direction:column; gap:8px}
.cm-item{font-size:12.5px; line-height:1.5; background:var(--wk-code); border-left:3px solid var(--wk-accent); border-radius:8px; padding:8px 10px}
.panel .empty-hint{font-size:12px; color:var(--wk-ink2); line-height:1.5}
.vz-grid{display:flex; flex-direction:column; gap:8px}
.vz-grid img{max-width:100%; border-radius:10px; border:1px solid var(--wk-line); cursor:zoom-in; display:block}
.fr-hover{outline:2px dashed var(--wk-accent); outline-offset:-2px; border-radius:10px}
.svc-details{color:var(--wk-ink2)}
.svc-details summary{cursor:pointer; font-size:10.5px; font-weight:600; opacity:.75; padding:2px 4px; list-style-position:outside}
.svc-details .panel{margin-top:8px; padding:10px 12px}
.svc-details .panel h3{font-size:9.5px; margin-bottom:7px}
.svc-details .ctx-row{font-size:10.5px; margin-bottom:4px}
.svc-details .ctx-row b{width:78px}
.svc-details .ctx-row code{font-size:9.3px}
.svc-details .evlog{max-height:130px}
.svc-details .evlog .ev{font-size:9.3px}
.svc-details .crmbox{font-size:9.3px; max-height:150px}
.lightbox{position:fixed; inset:0; background:rgba(10,6,20,.84); display:flex; align-items:center; justify-content:center; z-index:999; padding:28px; cursor:zoom-out}
.lightbox img{max-width:min(92vw,900px); max-height:92vh; border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.55)}

.toast{position:absolute; left:14px; right:14px; bottom:88px; z-index:70; background:rgba(24,18,38,.94); color:#fff; border-radius:14px; padding:12px 15px; font-size:12.5px; line-height:1.4; transform:translateY(16px); opacity:0; transition:all .22s; pointer-events:none}

  *{transition:none !important; animation:none !important; scroll-behavior:auto !important}
}

function matches(c, fs){
  if(fs.excl && !c.excl) return false;
  if(fs.special && !c.special) return false;
  if(fs.offer==='agr' && !c.agr) return false;
  if(fs.offer==='solaris' && !c.solaris) return false;
  if(fs.creditOpt==='credit' && !(c.creditRate>0)) return false;
  if(fs.creditOpt==='credit_special' && !c.creditSpec) return false;
  if(fs.gos && !c.gos) return false;
  if(fs.brand && c.brand!==fs.brand) return false;
  if(fs.model && c.model!==fs.model) return false;
  if(fs.state && c.state!==fs.state) return false;
  if(fs.body && c.body!==fs.body) return false;
  if(fs.engine && c.engine!==fs.engine) return false;
  if(fs.kpp && c.kpp!==fs.kpp) return false;
  if(fs.drive && c.drive!==fs.drive) return false;
  if(fs.city && c.city!==fs.city) return false;
  if(fs.priceMin && c.price<fs.priceMin) return false;
  if(fs.mileageMax && (c.mileage||0)>fs.mileageMax) return false;
  if(fs.priceMax && c.price>fs.priceMax) return false;
  if(fs.query){
    const q=fs.query.toLowerCase();
    const hay=(c.brand+' '+c.model+' '+c.trim+' '+c.body+' '+c.engine).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function applySort(list, sort){
  const l=[...list];
  if(sort==='priceAsc') l.sort((a,b)=>a.price-b.price);
  else if(sort==='priceDesc') l.sort((a,b)=>b.price-a.price);
  else if(sort==='new') l.sort((a,b)=>b.year-a.year || b.pop-a.pop);
  else l.sort((a,b)=>b.pop-a.pop);
  return l;
}
const queryCars = (fs, sort)=>applySort(CARS.filter(c=>matches(c, fs||{})), sort||'pop');

/* Карусель: автопрокрутка + точки, остановка при взаимодействии */
function bindCarousel(){
  const SL = (S.screen==='service' && S.market==='used') ? SLIDES_USED : SLIDES;
  const car=$('#carousel'), dots=$('#dots');
  if(!car) return;
  clearInterval(S.carousel.timer); S.carousel.idx=0; S.carousel.paused=false;
  const slideW = ()=> car.firstElementChild ? car.firstElementChild.offsetWidth+8 : 1;
  function setDot(i){ [...dots.children].forEach((d,j)=>d.classList.toggle('on', i===j)); }
  car.addEventListener('scroll', ()=>{
    const i=Math.round(car.scrollLeft/slideW());
    if(i!==S.carousel.idx && i>=0 && i<SL.length){ S.carousel.idx=i; setDot(i); track('carousel_slide_view',{slide_id:SL[i].id}); }
  }, {passive:true});
  /* Карусель статичная (правка 6): автоскролл выключен, листание только вручную свайпом */
  car.querySelectorAll('.slide').forEach(sl=>sl.onclick=()=>{
    const def=SL.find(s=>s.id===sl.dataset.slide);
    track('carousel_slide_tap',{slide_id:def.id});
    if(def.id==='utp') openPromo('banner_utp');
    else if(def.id==='tradein'){ track('tradein_slide_tap'); openTradein('banner_tradein'); }
    else if(def.id==='monjaro') openListing(FILTER_SETS.monjaro.fs, FILTER_SETS.monjaro.name, 'banner_monjaro');
    else if(def.id==='solaris') openListing({brand:'Solaris', model:'Uni V'}, 'Спец. предложение Solaris Uni V', 'banner_solaris');
    else if(def.id==='credit') openListing(FILTER_SETS.creditAll.fs, FILTER_SETS.creditAll.name, 'banner_credit');
    else if(def.id==='usedfaq') openUsedFaq();
    else if(def.id==='usedcredit') openListing({state:'used', creditOpt:'credit'}, 'Автокредит на авто с пробегом', 'banner_used_credit');
    else if(def.id==='tradein2'){ track('tradein_slide_tap'); openTradein('banner_tradein'); }
  });
  track('carousel_slide_view',{slide_id:SL[0].id});
}

const TI={ cat:'легковой', plateVal:'', c1:false, c2:false, c3:false, estimate:null, estimating:false, plateTracked:false };
const TI_CYR='АВЕКМНОРСТУХ';
const TI_LAT={A:'А',B:'В',E:'Е',K:'К',M:'М',H:'Н',O:'О',P:'Р',C:'С',T:'Т',Y:'У',X:'Х'};
const tiNorm = v => v.toUpperCase().split('').map(ch=>TI_LAT[ch]||ch).filter(ch=>(TI_CYR+'0123456789').includes(ch)).join('');
function tiFormat(raw){
  let out=''; const p=raw.slice(0,9);
  for(let i=0;i<p.length;i++){ const ch=p[i];
    if(i===0){ if(TI_CYR.includes(ch)) out+=ch; else break; }
    else if(i<=3){ if(/\d/.test(ch)) out+=(i===1?' ':'')+ch; else break; }
    else if(i<=5){ if(TI_CYR.includes(ch)) out+=(i===4?' ':'')+ch; else break; }
    else { if(/\d/.test(ch)) out+=(i===6?' ':'')+ch; else break; } }
  return out;
}

function tiUpdateSubmit(){
  if(S.screen!=='tradein' || TI.estimate) return;
  const b=$('#ctaBtn'); if(b) b.disabled=!(TI.c1&&TI.c2);
}
function tiBind(){
  const sc=$('#tiSelectCar');
  if(sc){ sc.onclick=()=>{ track('select_car_tap',{screen:'tradein'}); openListing({}, 'Автомобили', 'tradein_result'); }; }
  const rs=$('#tiReset');
  if(rs){ rs.onclick=()=>{ TI.estimate=null; TI.plateVal=''; renderTradein(); }; }
  const pi=$('#tiPlate');
  if(!pi) return;
  document.querySelectorAll('[data-ticat]').forEach(t=>t.onclick=()=>{
    TI.cat=t.dataset.ticat; TI.plateVal=''; track('ts_category_select',{value:TI.cat}); renderTradein();
  });
  const fld=$('#tiPlateFld');
  pi.addEventListener('input', ()=>{
    const moto=TI.cat==='мотоцикл'||TI.cat==='скутер';
    const raw=tiNorm(pi.value);
    if(!moto) pi.value=tiFormat(raw); else pi.value=pi.value.toUpperCase().slice(0,12);
    TI.plateVal=pi.value;
    const ok = moto ? raw.length>=5 : tiPlateValid(tiNorm(pi.value));
    fld.classList.toggle('valid', ok);
    fld.classList.remove('showerr'); pi.classList.remove('err');
    if(ok && !TI.plateTracked){ TI.plateTracked=true; track('plate_entered',{category:TI.cat}); }
  });
  ['tiC1','tiC2','tiC3'].forEach((id,i)=>$('#'+id).addEventListener('change', e=>{ TI['c'+(i+1)]=e.target.checked; tiUpdateSubmit(); }));
  tiUpdateSubmit();
}
function tiEstimate(){
  if(TI.estimating) return;
  const moto=TI.cat==='мотоцикл'||TI.cat==='скутер';
  const raw=tiNorm($('#tiPlate').value);
  const pOk = moto ? raw.length>=5 : tiPlateValid(raw);
  if(!pOk){
    $('#tiPlateFld').classList.add('showerr'); $('#tiPlate').classList.add('err');
    $('#tiPlateMsg').textContent = moto ? 'Введите номер ТС (не короче 5 символов).' : 'Введите госномер полностью в формате А 000 АА 000.';
    document.getElementById('tiFormSec').scrollIntoView({behavior:'smooth', block:'center'});
    $('#tiPlate').focus(); return;
  }
  $('#tiAlert').classList.remove('show');
  track('estimate_submit',{category:TI.cat});
  TI.estimating=true;
  const btn=$('#ctaBtn');
  btn.innerHTML='<span class="spinner"></span> Получаем оценку…'; btn.disabled=true;
  const t0=Date.now();
  setTimeout(()=>{
    TI.estimating=false;
    const digits=raw.replace(/\D/g,''), region=raw.slice(6);
    if(digits.slice(0,3)==='000'){
      track('estimate_error',{reason:'vehicle_not_found', latency_ms:Date.now()-t0});
      $('#tiPlateFld').classList.add('showerr'); $('#tiPlate').classList.add('err');
      $('#tiPlateMsg').textContent='Не удалось распознать госномер или найти ТС. Проверьте номер и попробуйте ещё раз.';
      btn.textContent='Получить оценку авто'; tiUpdateSubmit(); return;
    }
    if(region==='00'){
      track('estimate_error',{reason:'partner_api_unavailable', latency_ms:Date.now()-t0});
      const al=$('#tiAlert'); al.textContent='Не удалось получить оценку, попробуйте позже. Введённые данные сохранены.'; al.classList.add('show');
      btn.textContent='Получить оценку авто'; tiUpdateSubmit(); return;
    }
    let h=0; for(const ch of raw) h=(h*31+ch.charCodeAt(0))>>>0;
    const base=850000 + (h % 1650000);
    TI.estimate={ lo:Math.round(base*0.96/1000)*1000, hi:Math.round(base*1.07/1000)*1000,
      plate:$('#tiPlate').value, car:['Kia Rio, 2019','Hyundai Solaris, 2018','VW Polo, 2020','Skoda Rapid, 2019','Lada Vesta, 2021','Hyundai Creta, 2020'][h%6] };
    track('estimate_success',{latency_ms:Date.now()-t0, format:'range'});
    renderTradein(); $('#scroll').scrollTop=0; updateCtx();
  }, 1300);
}

/* ============================== КНОПКА-ОВЕРЛЕЙ FE-08 / CTA ============================== */
function renderCTA(screen){
  const z=$('#ctaZone');
  $('#scroll').classList.remove('no-cta');
  z.setAttribute('data-fr','fe08');
  if(screen==='service' || screen==='listing' || screen==='promo'){
    /* Кнопка-оверлей «Связаться с оператором» убрана (правка) */
    z.innerHTML='';
    z.removeAttribute('data-fr');
    $('#scroll').classList.add('no-cta');
    return;
  } else if(screen==='tradein'){
    z.setAttribute('data-fr','fe11');
    if(TI.estimate){
      z.innerHTML = annTag('Б-09 · CTA: «Вернуться к подбору авто» → каталог авто','ep','top:-8px; left:20px')
        + '<button class="cta" id="ctaBtn">Вернуться к подбору авто</button>';
      $('#ctaBtn').onclick=()=>{
        track('sticky_cta_tap',{screen:'tradein', mode:'back_to_catalog'});
        openListing({}, 'Автомобили', 'tradein_promo');
      };
    } else {
      z.innerHTML = annTag('Б-09 · CTA-оверлей «Получить оценку авто» — сабмит формы Б-03; активна после обязательных согласий','ep','top:-8px; left:20px')
        + '<button class="cta" id="ctaBtn" disabled>Получить оценку авто</button>';
      $('#ctaBtn').onclick=()=>{ track('sticky_cta_tap',{screen:'tradein', mode:'estimate_submit'}); tiEstimate(); };
      tiUpdateSubmit();
    }
  } else if(screen==='car'){
    z.innerHTML = '<button class="cta" id="ctaBtn">Связаться с менеджером</button>';
    $('#ctaBtn').onclick=()=>openChat('car_card');
  } else z.innerHTML='';
}

/* ============================== ШТОРКИ ============================== */
function openSheet(html, onClose){
  const back=$('#sheetBack'), sh=$('#sheet');
  back.hidden=false; sh.hidden=false;
  sh.innerHTML='<div class="grab"><i></i></div>'+html;
  requestAnimationFrame(()=>{ back.classList.add('show'); sh.classList.add('show'); });
  back.onclick=()=>closeSheet(onClose);
  return sh;
}
function closeSheet(onClose){
  const back=$('#sheetBack'), sh=$('#sheet');
  back.classList.remove('show'); sh.classList.remove('show');
  setTimeout(()=>{ back.hidden=true; sh.hidden=true; sh.innerHTML=''; }, 270);
  if(onClose) onClose();
}

    + '<div class="sh-foot"><button class="btn-primary" id="fApply"></button></div>');
  sh.querySelector('[data-close]').onclick=()=>closeSheet();

  function fchip(group, val, label){
    const on = fs[group]===val;
    return '<button class="fchip'+(on?' on':'')+'" data-g="'+group+'" data-v="'+esc(val)+'">'+esc(label)+'</button>';
  }
  function renderBody(){
    const b=sh.querySelector('#fBody');
    let h='';
    h+='<div class="fgroup"><b>Марка</b><div class="fchips">'+BRANDS.map(br=>fchip('brand',br,br)).join('')+'</div></div>';
    const models = fs.brand ? [...new Set(CARS.filter(c=>c.brand===fs.brand).map(c=>c.model))] : [];
    h+='<div class="fgroup"><b>Модель</b>'+(fs.brand
      ? '<div class="fchips">'+models.map(m=>fchip('model',m,m)).join('')+'</div>'
      : '<div style="font-size:12px;color:var(--ink2)">Сначала выберите марку</div>')+'</div>';
    h+='<div class="fgroup"><b>Состояние</b><div class="fchips">'+fchip('state','new','Новый')+fchip('state','used','С пробегом')+'</div></div>';
    h+='<div class="fgroup"><b>Цена</b><div class="frange">'
      + '<label>от <input type="number" inputmode="numeric" id="fMin" placeholder="500 000" value="'+(fs.priceMin||'')+'"></label>'
      + '<label>до <input type="number" inputmode="numeric" id="fMax" placeholder="8 000 000" value="'+(fs.priceMax||'')+'"></label></div></div>';
    h+='<div class="fgroup" style="position:relative">'+ '<span class="ann ann-abs" style="top:8px;right:0"><span class="ann-tag">ACT-03 · сразу после «Цены»</span></span>'
      + '<b>Автокредит</b><div class="fchips">'+fchip('creditOpt','credit','В кредит')+fchip('creditOpt','credit_special','В кредит со спецпредложением')+'</div></div>';
    h+='<div class="fgroup"><div class="fswitch"><div><b>Скидка по госпрограмме</b><small>Электромобили из перечня субсидируемых (ACT-06)</small></div>'
      + '<button class="sw'+(fs.gos?' on':'')+'" id="fGos" role="switch" aria-checked="'+(!!fs.gos)+'" aria-label="Скидка по госпрограмме"></button></div></div>';
    h+='<div class="fgroup"><b>Тип кузова</b><div class="fchips">'+['седан','кроссовер','лифтбек','универсал'].map(v=>fchip('body',v,v[0].toUpperCase()+v.slice(1))).join('')+'</div></div>';
    h+='<div class="fgroup"><b>Тип двигателя</b><div class="fchips">'+['бензин','дизель','гибрид','электро'].map(v=>fchip('engine',v,v[0].toUpperCase()+v.slice(1))).join('')+'</div></div>';
    h+='<div class="fgroup"><b>Коробка передач</b><div class="fchips">'+['AT','MT','CVT','DCT'].map(v=>fchip('kpp',v,v)).join('')+'</div></div>';
    h+='<div class="fgroup"><b>Привод</b><div class="fchips">'+fchip('drive','передний','Передний')+fchip('drive','полный','Полный')+'</div></div>';
    h+='<div class="fgroup"><b>Город получения</b><div class="fchips">'+[...new Set(CARS.map(c=>c.city))].map(v=>fchip('city',v,v)).join('')+'</div></div>';
    h+=annBlock('FR-02: порядок первого экрана шторки — Марка → Модель → Цена → Автокредит → остальные; состав сверяется с каталогом на дизайн-ревью. Год, пробег и мощность — в полной версии шторки.');
    h+='<div style="height:8px"></div>';
    b.innerHTML=h;
    b.querySelectorAll('.fchip[data-g]').forEach(btn=>btn.onclick=()=>{
      const g=btn.dataset.g, v=btn.dataset.v;
      if(fs[g]===v) delete fs[g]; else fs[g]=v;
      if(g==='brand') delete fs.model;
      renderBody();
    });
    const mn=b.querySelector('#fMin'), mx=b.querySelector('#fMax');
    [mn,mx].forEach(inp=>inp.addEventListener('input',()=>{
      const v1=parseInt(mn.value,10), v2=parseInt(mx.value,10);
      if(v1>0) fs.priceMin=v1; else delete fs.priceMin;
      if(v2>0) fs.priceMax=v2; else delete fs.priceMax;
      updateApply();
    }));
    b.querySelector('#fGos').onclick=e=>{ if(fs.gos) delete fs.gos; else fs.gos=true; renderBody(); };

    const n=queryCars(fs).length;
    const btn=sh.querySelector('#fApply');

  };
  renderBody();

const DRAFTS={
  pick_car:{ id:'draft_pick_car_v1', text:'Добрый день! Помогите, пожалуйста, подобрать автомобиль.' },
  trade_in:{ id:'draft_trade_in_v1', text:'Добрый день! Хочу сдать свой автомобиль в трейд-ин. Подскажите, как получить оценку.' },
  car_card:{ id:'draft_car_card_v1', text:null }, // формируется из контекста
};
const REPLIES={
  pick_car:'Здравствуйте! Я Марина, менеджер WB Авто 👋 Подскажите, какой бюджет и тип кузова рассматриваете? Соберу для вас подборку с лучшими условиями кредита.',
  trade_in:'Здравствуйте! Помогу с трейд-ин. Пришлите, пожалуйста, марку, модель, год выпуска и пробег вашего автомобиля — вернусь с предварительной оценкой в течение часа.',
  car_card:'Здравствуйте! Отличный выбор 👍 Автомобиль в наличии. Могу рассчитать кредит от 3,5% и зафиксировать цену — подсказать по условиям доставки?',
};
function draftFor(entry){
  if(entry==='car_card'){
    const c=CARS.find(x=>x.id===S.carId);
    if(c) return 'Добрый день! Интересует '+c.brand+' '+c.model+': wb://auto/card/'+c.id+'. Расскажите, пожалуйста, об условиях покупки.';
    return 'Добрый день! Расскажите, пожалуйста, об условиях покупки.';
  }
  return DRAFTS[entry].text;
}
function chatMsgsHTML(){
  return S.chat.msgs.map(m=>'<div class="msg '+m.who+'">'+esc(m.text)+'<span class="t">'+m.t+'</span></div>').join('');
}
function openChat(entry){
  track('chat_sheet_open',{entry_point:entry});
  S.entry=entry; updateCtx();
  const active=S.chat.started;
  if(!active){
    S.chat.entry=entry;
    S.chat.baseDraft=draftFor(entry);
    S.chat.prefId=DRAFTS[entry] ? DRAFTS[entry].id : null;
  }
  let sent=false;
  const sh=openSheet(
    '<div class="sh-head"><div class="mgr-head"><div class="ava">М</div><div><b>WB Авто · менеджер</b><small>онлайн, отвечает ~2 мин</small></div></div>'
    + '<button class="icbtn" data-close style="margin-left:auto">'+icon('ic-x',20,20)+'</button></div>'
    + '<div class="sh-body"><div class="chat-body" id="chatBody">'
    + (active
        ? chatMsgsHTML()
        : '<div class="chat-note">Черновик подставлен по точке входа <b>'+esc(entry)+'</b> — отредактируйте при необходимости и нажмите «Отправить». Без отправки обращение не создаётся.</div>')
    + '</div>'
    + annBlock('FR-12: черновик не отправляется автоматически; entry_point и контекст уходят менеджеру отдельными полями BE-01, не только текстом. Повторное открытие при активном диалоге показывает историю, а не новый черновик.')
    + '<div style="height:10px"></div></div>'
    + '<div class="sh-foot"><div class="chat-input">'
    + '<textarea id="chatDraft" rows="2" aria-label="Сообщение менеджеру"'+(active?' placeholder="Написать сообщение…"':'')+'>'+(active?'':esc(S.chat.baseDraft))+'</textarea>'
    + '<button class="sendbtn" id="chatSend" aria-label="Отправить">'+icon('ic-send',21,21)+'</button></div></div>',
    ()=>{ if(!sent && !S.chat.started) track('chat_sheet_close_without_send',{entry_point:entry}); }
  );
  sh.querySelector('[data-close]').onclick=()=>closeSheet(()=>{ if(!sent && !S.chat.started) track('chat_sheet_close_without_send',{entry_point:entry}); });
  const ta=sh.querySelector('#chatDraft'), body=sh.querySelector('#chatBody');
  body.scrollIntoView && (sh.querySelector('.sh-body').scrollTop = 1e5);
  sh.querySelector('#chatSend').onclick=()=>{
    const text=ta.value.trim();
    if(!text) return;
    const now=new Date(); const t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const first=!S.chat.started;
    S.chat.msgs.push({who:'user', text, t});
    S.chat.started=true; sent=true;
    ta.value='';
    body.innerHTML=chatMsgsHTML();
    sh.querySelector('.sh-body').scrollTop=1e5;
    if(first){
      const edited = text!==S.chat.baseDraft;
      track('chat_prefilled_send',{prefilled_text_id:S.chat.prefId, edited:edited?'да':'нет'});
      const payload={ channel:'chat', entry_point:S.chat.entry, prefilled_text_id:S.chat.prefId, message_text:text };
      if(S.chat.entry==='car_card'){
        const c=CARS.find(x=>x.id===S.carId);
        if(c){ payload.nm_id=c.id; payload.car_name=c.brand+' '+c.model; payload.car_url='wb://auto/card/'+c.id; payload.price_at_submit=c.price; }
      }
      crmSubmit(payload);
      if(S.chat.entry==='trade_in') track('tradein_request_submit');
      setTimeout(()=>{
        const now2=new Date(); const t2=String(now2.getHours()).padStart(2,'0')+':'+String(now2.getMinutes()).padStart(2,'0');
        S.chat.msgs.push({who:'mgr', text:REPLIES[S.chat.entry]||REPLIES.pick_car, t:t2});
        const b2=document.querySelector('#chatBody');
        if(b2){ b2.innerHTML=chatMsgsHTML(); b2.closest('.sh-body').scrollTop=1e5; }
      }, 1100);
    }
  };
}

    + '<div class="sh-body">'
    + '<label class="fld"><span>Марка и модель</span><input id="searchQ" type="search" placeholder="Например, Solaris HS" autocomplete="off"></label>'

    + '<div style="height:10px"></div></div>'
    + '<div class="sh-foot"><button class="btn-primary" id="searchGo" disabled>Найти</button></div>'
  );
  sh.querySelector('[data-close]').onclick=()=>closeSheet();
  const inp=sh.querySelector('#searchQ'), go=sh.querySelector('#searchGo'), list=sh.querySelector('#sugList');
  const st=S.market==='used'?'used':'new';
  const items=[...new Map(CARS.filter(c=>c.state===st).map(c=>[c.brand+' '+c.model, c])).values()];
  function doSearch(q){
    closeSheet();
    track('search_submit',{query:q, market:S.market});
    openListing({query:q, state:st}, 'Поиск: «'+q+'»', 'topbar_search');
  }
  function renderSug(){
    const q=inp.value.trim().toLowerCase();
    go.disabled=!q;
    const found=q?items.filter(c=>(c.brand+' '+c.model).toLowerCase().includes(q)).slice(0,6):[];
    list.innerHTML=found.map(c=>'<button data-q="'+esc(c.brand+' '+c.model)+'">'+icon('ic-search',15,15)+'<span>'+esc(c.brand+' '+c.model)+'</span><span class="sug-sub">'+fmt(c.price)+'</span></button>').join('');
    list.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>doSearch(b.dataset.q));
  }
  inp.addEventListener('input',renderSug);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&inp.value.trim()) doSearch(inp.value.trim()); });
  go.onclick=()=>{ if(inp.value.trim()) doSearch(inp.value.trim()); };
  setTimeout(()=>{ try{inp.focus();}catch(e){} },300);
}

    + '<p style="font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.5">Колл-центр WB Авто. Ежедневно с 8:00 до 22:00 (мск), звонок по России бесплатный.</p>'
    + annBlock('Точка входа «прямой звонок»: без формы и чата — набор номера КЦ с устройства; событие direct_call_start.')
    + '<div style="height:10px"></div></div>'
    + '<div class="sh-foot"><a class="btn-primary" href="tel:88001000000" id="callNow" style="text-decoration:none">Позвонить</a></div>'
  );
  sh.querySelector('[data-close]').onclick=()=>closeSheet();
  sh.querySelector('#callNow').onclick=()=>{ track('direct_call_start'); toast('Набор номера 8 (800) 100-00-00 — на устройстве откроется приложение телефона'); };
}

function openLeadForm(entry){
  track('lead_form_open',{entry_point:entry});
  S.entry=entry; updateCtx();
  if(S.leadSent[entry]){ showSuccess(S.leadSent[entry], entry, true); return; }
  const sh=openSheet(
    '<div class="sh-head"><h3>Ваши контакты</h3><button class="icbtn" data-close>'+icon('ic-x',20,20)+'</button></div>'
    + '<div class="sh-body">'
    + '<p style="font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:14px">Менеджер WB Авто перезвонит, ответит на вопросы и поможет с покупкой. Форма — единый модуль БТ «Заказ обратного звонка».</p>'
    + '<label class="fld"><span>Как вас зовут</span><input id="lfName" type="text" autocomplete="name" placeholder="Имя и фамилия"></label>'
    + '<label class="fld"><span>Телефон</span><input id="lfPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00"></label>'
    + '<label class="agree"><input type="checkbox" id="lfAgree" checked> Соглашаюсь на обработку персональных данных и получение звонка от WB Авто</label>'
    + annBlock('BE-03/BE-01: заявка создаётся с entry_point='+entry+(entry==='overlay_listing'?' + filter_set листинга':'')+'; статус «Новое», очередь — первая линия КЦ WB Авто; технические повторы не создают дублей.')
    + '<div style="height:8px"></div></div>'
    + '<div class="sh-foot"><button class="btn-primary" id="lfSubmit">Отправить заявку</button></div>'
  );
  sh.querySelector('[data-close]').onclick=()=>closeSheet();
  sh.querySelector('#lfSubmit').onclick=()=>{
    const nm=sh.querySelector('#lfName'), ph=sh.querySelector('#lfPhone'), ag=sh.querySelector('#lfAgree');
    let ok=true;
    if(nm.value.trim().length<2){ nm.classList.add('err'); ok=false; } else nm.classList.remove('err');
    const digits=ph.value.replace(/\D/g,'');
    if(digits.length<10){ ph.classList.add('err'); ok=false; } else ph.classList.remove('err');
    if(!ag.checked){ toast('Для звонка нужно согласие на обработку данных'); ok=false; }
    if(!ok) return;
    const payload={ channel:'callback_form', entry_point:entry, full_name:nm.value.trim(), mobile_phone:'+7'+digits.slice(-10) };
    if(entry==='overlay_listing') payload.filter_set=S.listing.fs;
    const body=crmSubmit(payload);
    S.leadSent[entry]=body.contact_request_id;
    track('lead_form_submit',{entry_point:entry});
    showSuccess(body.contact_request_id, entry, false);
  };
}
function showSuccess(reqId, entry, repeat){
  const sh=openSheet(
    '<div class="sh-body"><div class="success">'
    + '<div class="s-ic">'+icon('ic-check',34,34)+'</div>'
    + '<h3>Ваша заявка отправлена</h3>'
    + '<p>Менеджер WB Авто свяжется с вами в ближайшее время — обычно в течение 15 минут в рабочие часы.</p>'
    + '<span class="rid">'+esc(reqId)+' · '+esc(entry)+'</span>'
    + (repeat?'<p style="margin-top:10px;color:var(--green);font-weight:600">Заявка уже создана — дубль не отправляем (FR-15)</p>':'')
    + '</div>'
    + annBlock('Экран успеха — FE-05 модуля колбэка, используется единообразно; повторный показ не создаёт дубль обращения.')
    + '<div style="height:8px"></div></div>'
    + '<div class="sh-foot"><button class="btn-primary" id="sOk">Понятно</button></div>'
  );
  sh.querySelector('#sOk').onclick=()=>closeSheet();
}

/* ============================== НАВИГАЦИЯ ============================== */
function pushNav(){ S.nav.push({screen:S.screen, listing:JSON.parse(JSON.stringify(S.listing)), carId:S.carId, entry:S.entry}); }
function goBack(){
  const prev=S.nav.pop();
  if(!prev){ toast('Возврат на предыдущий экран — каталог WB (вне прототипа)'); return; }
  S.screen=prev.screen; S.listing=prev.listing; S.carId=prev.carId; S.entry=prev.entry;
  renderAll(true);
}
function goto(screen){
  if(screen===S.screen && screen!=='listing') return;
  if(screen==='service'){ S.nav=[]; S.screen='service'; S.entry=null; renderAll(); }
  else if(screen==='listing'){ openListing({}, 'Автомобили', 'nav_panel'); }
  else if(screen==='promo'){ openPromo('nav_panel'); }
  else if(screen==='tradein'){ openTradein('nav_panel'); }
  else if(screen==='car'){ openCar(CARS[0].id); }
}
function bindSnippets(){
  document.querySelectorAll('.snippet[data-car]').forEach(sn=>sn.onclick=()=>{
    const id=+sn.dataset.car, ctx=sn.dataset.ctx||'';
    if(ctx==='feed') track('recommend_snippet_tap',{nm_id:id});
    else track('snippet_tap',{nm_id:id, block:ctx});
    openCar(id, ctx);
  });
}
function renderAll(isBack){
  renderChrome();
  if(S.screen==='service') renderService();
  else if(S.screen==='listing') renderListing();
  else if(S.screen==='promo') renderPromo();
  else if(S.screen==='tradein') renderTradein();
  else if(S.screen==='car') renderCar();
  $('#scroll').scrollTop=0;
  updateCtx();
}

/* ============================== ПАНЕЛЬ ВЕРСТАКА ============================== */
const NAV_SCREENS=[
  ['service','Витрина Сервиса','FE-01…08'],
  ['listing','Листинг подборки','FE-09'],
  ['promo','Промо-страница','FE-10'],
  ['tradein','Трейд-ин','FE-11'],
  ['car','Карточка авто','заглушка'],
];
const navGrid=$('#navGrid');
if(navGrid){
  navGrid.innerHTML = NAV_SCREENS.map(n=>'<button class="navbtn" data-scr="'+n[0]+'">'+n[1]+'<small>'+n[2]+'</small></button>').join('');
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>goto(b.dataset.scr));
}

/* Лайтбокс для примеров визуализации */
document.addEventListener('click', e=>{
  const img = e.target.closest ? e.target.closest('img[data-zoom]') : null;
  if(!img) return;
  const lb=document.createElement('div'); lb.className='lightbox';
  const big=document.createElement('img'); big.src=img.src; big.alt=img.alt||'';
  lb.appendChild(big); lb.onclick=()=>lb.remove();
  document.body.appendChild(lb);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const lb=document.querySelector('.lightbox'); if(lb) lb.remove(); } });

const annT=$('#annToggle');
if(annT) annT.onclick=function(){
  S.ann=!S.ann;
  this.classList.toggle('on', S.ann);
  this.setAttribute('aria-pressed', String(S.ann));
  document.documentElement.classList.toggle('wk-ann-on', S.ann);
};

/* ============================== СТАРТ ============================== */
renderAll();
</script>
